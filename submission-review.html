<main id="main" class="wrap moderation">
  <p class="kicker">Site owner</p>
  <h1>Timeline submissions</h1>
  <p>Review suggested sources for the Atlas. Shortlist works to consider or mark them as not selected. Adding a work to the timeline remains a separate editorial decision.</p>
  <p><a href="/moderation/">Review comments</a> &middot; <a href="/submit/">Suggest a work</a></p>
  <section data-submission-list="review" aria-label="Timeline submission queue">
    <div class="moderation-toolbar">
      <label for="submissions-status">Show suggestions<select id="submissions-status"><option value="pending">Awaiting review</option><option value="shortlisted">Shortlisted</option><option value="declined">Not selected</option></select></label>
      <button class="button secondary" id="submissions-refresh" type="button">Refresh queue</button>
      <a href="/signout-with-chatgpt?return_to=%2F" target="_top">Sign out</a>
    </div>
    <p id="submissions-notice" role="status" aria-live="polite">Loading suggestions...</p>
    <div id="submissions-list"></div>
    <div class="moderation-pagination"><button class="button secondary" id="submissions-previous" type="button" disabled>Previous</button><button class="button secondary" id="submissions-next" type="button" disabled>Next</button></div>
  </section>
  <noscript><p>Enable JavaScript to load and review submissions.</p></noscript>
</main>
